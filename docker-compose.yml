version: '3.8'

services:
  auth-service:
    build: ./auth-social
    image: auth-service:latest
    environment:
      DB_URL: ${AUTH_DB_URL}
      DB_USERNAME: ${AUTH_DB_USERNAME}
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      SERVICE_SECRET: ${SERVICE_SECRET}
      PROFILE_SERVICE_URL: http://profile-service:8081
    depends_on:
      - profile-service
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - monitoring

  profile-service:
    build: ./Profile_social-
    image: profile-service:latest
    environment:
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      SERVICE_SECRET: ${SERVICE_SECRET}
      MONGO_URI: ${PROFILE_MONGO_URI}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY_PROFILE}
      R2_SECRET_KEY: ${R2_SECRET_KEY_PROFILE}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID_PROFILE}
      R2_PUBLIC_BASE_URL: ${R2_PROFILE_BASE_URL}
      R2_ENDPOINT: ${R2_ENDPOINT_PROFILE}
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - monitoring

  post-service:
    build: ./Post_Social
    image: post-service:latest
    environment:
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      SERVICE_SECRET: ${SERVICE_SECRET}
      MONGO_URI: ${POST_MONGO_URI}
      R2_ACCOUNT_ID: ${R2_POST_ACCOUNT_ID}
      R2_ACCESS_KEY: ${R2_POST_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_POST_SECRET_KEY}
      R2_POSTS_PUBLIC_URL: ${R2_POSTS_PUBLIC_URL}
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - monitoring

  likes-service:
    build: ./social-likesAndcomments
    image: likes-service:latest
    environment:
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      SERVICE_SECRET: ${SERVICE_SECRET}
      MONGO_URI: ${LIKES_MONGO_URI}
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - monitoring

  reel-service:
    build: ./social_reels
    image: reel-service:latest
    environment:
      MONGO_URI: ${REEL_MONGO_URI}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      SERVICE_SECRET: ${SERVICE_SECRET}
      R2_ACCOUNT_ID: ${R2_REEL_ACCOUNT_ID}
      R2_ACCESS_KEY: ${R2_REEL_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_REEL_SECRET_KEY}
      R2_PUBLIC_BASE_URL: ${R2_REEL_PUBLIC_URL}
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - monitoring

  interaction-service:
    build: ./social_interaction
    image: interaction-service:latest
    environment:
      MONGO_URI: ${INTERACTION_MONGO_URI}
      SERVICE_SECRET: ${SERVICE_SECRET}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - monitoring

  feed-service:
    build: ./social_feed
    image: feed-service:latest
    ports:
      - "8086:8086"
    environment:
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      SERVICE_SECRET: ${SERVICE_SECRET}
      MONGO_URI: ${FEED_MONGO_URI}
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - monitoring

  view-service:
    build: ./social_view
    image: view-service:latest
    ports:
      - "8087:8087"
    environment:
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      SERVICE_SECRET: ${SERVICE_SECRET}
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - monitoring

  interest-service:
    build: ./social-interest
    image: interest-service:latest
    ports:
      - "8088:8088"
    environment:
      MONGO_URI: ${INTEREST_MONGO_URI}
      SERVICE_SECRET: ${SERVICE_SECRET}
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - monitoring

  reelfetch-service:
    build: ./social-reelFetch
    image: reelfetch-service:latest
    ports:
      - "8089:8089"
    environment:
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      SERVICE_SECRET: ${SERVICE_SECRET}
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - monitoring

  chat-service:
    build: ./social_chat
    image: chat-service:latest
    environment:
      CHAT_MONGO_URI: ${CHAT_MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      INSTANCE_NAME: "chat-instance-{{.Task.Slot}}"
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      SERVICE_SECRET: ${SERVICE_SECRET}
      CHAT_R2_ENDPOINT: ${CHAT_R2_ENDPOINT}
      CHAT_R2_ACCESS_KEY: ${CHAT_R2_ACCESS_KEY}
      CHAT_R2_SECRET_KEY: ${CHAT_R2_SECRET_KEY}
      CHAT_R2_PUBLIC_URL: ${CHAT_R2_PUBLIC_URL}
    depends_on:
      - redis
    expose:
      - "8090"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - monitoring

  gateway:
    build: gateway
    image: gateway:latest
    ports:
      - "8091:8091"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - monitoring

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    deploy:
      replicas: 1 # Databases/caches should not be casually scaled without primary/replica cluster configuration
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - monitoring

  kafka:
    image: apache/kafka-native:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_CLUSTER_ID: '4L62ydZaTfa6BiwQHexgZw'
    deploy:
      replicas: 1 # Core data single-node configurations should remain 1 unless setting up a structural Kafka cluster
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
        reservations:
          cpus: '0.50'
          memory: 512M
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - '9090:9090'
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    ports:
      - '3000:3000'
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - monitoring

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: [ "--config=/etc/otel-config.yaml" ]
    volumes:
      - ./otel-config.yaml:/etc/otel-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC port
      - "4318:4318" # OTLP HTTP port (Your Spring apps call this)
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - monitoring

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # Jaeger UI port (Open this in your browser)
      - "4317"        # Exposed internally for OTel collector gRPC ingestion
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - monitoring


volumes:
  prometheus-data:
  grafana-data:

networks:
  monitoring:
    driver: bridge
    attachable: true
