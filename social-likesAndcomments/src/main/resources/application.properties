spring.application.name=social_likes

# MongoDB

spring.data.mongodb.uri=${MONGO_URI}

# JWT
service.gateway.secret= ${GATEWAY_SECRET}

# Internal Service Authentication

service.secret=${SERVICE_SECRET}

# Internal Services

reel.service=http://reel-service:8084
post.service=http://post-service:8082
profile.uri=http://profile-service:8081
view.uri=http://view-service:8087

# Health

health.api=http://likes-service:8083/api/health

# Server

server.port=8083

# Logging

logging.level.org.springframework.web=INFO
logging.level.root=INFO
logging.level.com.example.social_likes=INFO
logging.level.org.springframework=INFO


management.datadog.metrics.export.enabled=true


management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://otel-collector:4318/v1/traces

# Enforce W3C Trace Context headers (Gateway and services must match)
management.tracing.propagation.type=w3c
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true

management.metrics.tags.application=likes-service

logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

spring.kafka.listener.observation-enabled=true

spring.kafka.bootstrap-servers=kafka:9092

spring.kafka.consumer.group-id=comment-service
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.social_likes.dto.DenormalizeEvent
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.social_likes.dto

spring.kafka.consumer.auto-offset-reset=earliest


