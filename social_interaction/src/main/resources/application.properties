spring.application.name=social_interaction

# Retry

resilience4j.retry.instances.importantApi.max-attempts=3
resilience4j.retry.instances.importantApi.wait-duration=2s
resilience4j.retry.instances.importantApi.enable-exponential-backoff=true
resilience4j.retry.instances.importantApi.exponential-backoff-multiplier=2

resilience4j.retry.instances.importantApi.retry-exceptions=\
java.net.ConnectException,\
java.net.SocketTimeoutException,\
feign.RetryableException

# Circuit Breaker

resilience4j.circuitbreaker.instances.importantApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.importantApi.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.importantApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.importantApi.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.importantApi.permitted-number-of-calls-in-half-open-state=3

# MongoDB

spring.data.mongodb.uri=${MONGO_URI}

# Internal Secrets

service.secret.gateway= ${GATEWAY_SECRET}
service.secret=${SERVICE_SECRET}

# Service URLs

auth.uri=http://auth-service:8080
profile.uri=http://profile-service:8081
feed.uri=http://feed-service:8086
chat-service=http://nginx:8090

# Health

ping.uri=http://interaction-service:8085/api/health

# Server

server.port=8085

spring.data.redis.host=redis
spring.data.redis.port=6379

# Logging

logging.level.org.springframework.web=INFO
logging.level.root=INFO
logging.level.com.example.social_likes=INFO
logging.level.org.springframework=INFO


management.datadog.metrics.export.enabled=true


management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://otel-collector:4318/v1/traces

# Enforce W3C Trace Context headers (Gateway and services must match)
management.tracing.propagation.type=w3c

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true

management.metrics.tags.application=interaction-service

logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

spring.kafka.listener.observation-enabled=true

spring.kafka.bootstrap-servers=kafka:9092

spring.kafka.consumer.group-id=interaction-service
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.social_interaction.dto.DenormalizeEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.social_interaction.dto

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=60000

spring.kafka.template.observation-enabled=true
spring.kafka.producer.properties.spring.json.add.type.headers=true

spring.kafka.consumer.properties.allow.auto.create.topics=true


spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false


logging.level.org.springframework.kafka=DEBUG
logging.level.org.apache.kafka.clients.consumer=INFO

