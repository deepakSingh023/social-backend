spring.application.name=gateway
server.port=8080
spring.jwt.secret=YOUR_SECRET

# Redis Data Connection
spring.data.redis.host=redis
spring.data.redis.port=6379

########################################################
# Spring Cloud Gateway MVC Routes (With Rate Limiting)
########################################################

# 0. Auth Service (Rate limited by IP, no prefix stripping needed)
spring.cloud.gateway.mvc.routes[0].id=auth-service
spring.cloud.gateway.mvc.routes[0].uri=http://auth-service:8080
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/auth/**
# FIXED: Proper MVC property mapping for the built-in RateLimiter filter args
spring.cloud.gateway.mvc.routes[0].filters[0].name=RateLimiter
spring.cloud.gateway.mvc.routes[0].filters[0].args.capacity=20
spring.cloud.gateway.mvc.routes[0].filters[0].args.rate=10
spring.cloud.gateway.mvc.routes[0].filters[0].args.key-resolver=#{@ipKeyResolver}
spring.cloud.gateway.mvc.routes[0].filters[1]=#{@myHeaderFilter}

# 1. Post Service (Strips /api/posts prefix & checks Token limit)
spring.cloud.gateway.mvc.routes[1].id=post-service
spring.cloud.gateway.mvc.routes[1].uri=http://post-service:8080
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/posts/**
spring.cloud.gateway.mvc.routes[1].filters[0]=StripPrefix=2
spring.cloud.gateway.mvc.routes[1].filters[1].name=RateLimiter
spring.cloud.gateway.mvc.routes[1].filters[1].args.capacity=100
spring.cloud.gateway.mvc.routes[1].filters[1].args.rate=50
spring.cloud.gateway.mvc.routes[1].filters[1].args.key-resolver=#{@tokenKeyResolver}
spring.cloud.gateway.mvc.routes[1].filters[2]=#{@myHeaderFilter}

# 2. Profile Service
spring.cloud.gateway.mvc.routes[2].id=profile-service
spring.cloud.gateway.mvc.routes[2].uri=http://profile-service:8080
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/profile/**
spring.cloud.gateway.mvc.routes[2].filters[0]=StripPrefix=2
spring.cloud.gateway.mvc.routes[2].filters[1].name=RateLimiter
spring.cloud.gateway.mvc.routes[2].filters[1].args.capacity=60
spring.cloud.gateway.mvc.routes[2].filters[1].args.rate=30
spring.cloud.gateway.mvc.routes[2].filters[1].args.key-resolver=#{@tokenKeyResolver}

# 3. Feed Service
spring.cloud.gateway.mvc.routes[3].id=feed-service
spring.cloud.gateway.mvc.routes[3].uri=http://feed-service:8080
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/feed/**
spring.cloud.gateway.mvc.routes[3].filters[0]=StripPrefix=2
spring.cloud.gateway.mvc.routes[3].filters[1].name=RateLimiter
spring.cloud.gateway.mvc.routes[3].filters[1].args.capacity=200
spring.cloud.gateway.mvc.routes[3].filters[1].args.rate=100
spring.cloud.gateway.mvc.routes[3].filters[1].args.key-resolver=#{@tokenKeyResolver}

# 4. Comment Service
spring.cloud.gateway.mvc.routes[4].id=comment-service
spring.cloud.gateway.mvc.routes[4].uri=http://comment-service:8080
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/api/comments/**
spring.cloud.gateway.mvc.routes[4].filters[0]=StripPrefix=2
spring.cloud.gateway.mvc.routes[4].filters[1].name=RateLimiter
spring.cloud.gateway.mvc.routes[4].filters[1].args.capacity=80
spring.cloud.gateway.mvc.routes[4].filters[1].args.rate=40
spring.cloud.gateway.mvc.routes[4].filters[1].args.key-resolver=#{@tokenKeyResolver}

# 5. Interaction Service
spring.cloud.gateway.mvc.routes[5].id=interaction-service
spring.cloud.gateway.mvc.routes[5].uri=http://interaction-service:8080
spring.cloud.gateway.mvc.routes[5].predicates[0]=Path=/api/interactions/**
spring.cloud.gateway.mvc.routes[5].filters[0]=StripPrefix=2
spring.cloud.gateway.mvc.routes[5].filters[1].name=RateLimiter
spring.cloud.gateway.mvc.routes[5].filters[1].args.capacity=80
spring.cloud.gateway.mvc.routes[5].filters[1].args.rate=40
spring.cloud.gateway.mvc.routes[5].filters[1].args.key-resolver=#{@tokenKeyResolver}

############################
# Actuator & Observability
############################
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=gateway
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://otel-collector:4318/v1/traces

logging.level.org.springframework.cloud.gateway=INFO
logging.pattern.level=%5p [traceId=%X{traceId:-},spanId=%X{spanId:-}]
