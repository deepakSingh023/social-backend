spring.application.name=gateway
server.port=8091

spring.jwt.secret=${JWT_SECRET}
app.gateway.secret=${GATEWAY_SECRET}

# Redis Connection (Natively binds to properties limiters)
spring.data.redis.host=redis
spring.data.redis.port=6379

######################################################################
# Core Gateway Routing Definition Matrix (Strict Index Alignment)
######################################################################

# 1. Auth Service
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://auth-service:8080
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.key-resolver=#{@ipKeyResolver}
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.replenishRate=20
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.burstCapacity=20

# 2. Post Service
spring.cloud.gateway.server.webflux.routes[1].id=post-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://post-service:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/posts/**
spring.cloud.gateway.server.webflux.routes[1].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.key-resolver=#{@tokenKeyResolver}
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.redis-rate-limiter.replenishRate=100
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.redis-rate-limiter.burstCapacity=100

# 3. Profile Service
spring.cloud.gateway.server.webflux.routes[2].id=profile-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://profile-service:8081
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/profiles/**
spring.cloud.gateway.server.webflux.routes[2].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.key-resolver=#{@tokenKeyResolver}
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.redis-rate-limiter.replenishRate=60
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.redis-rate-limiter.burstCapacity=60

# 4. Feed Service
spring.cloud.gateway.server.webflux.routes[3].id=feed-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://feed-service:8086
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/getFeed/**
spring.cloud.gateway.server.webflux.routes[3].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.key-resolver=#{@tokenKeyResolver}
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.redis-rate-limiter.replenishRate=200
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.redis-rate-limiter.burstCapacity=200

# 5. Likes Service
spring.cloud.gateway.server.webflux.routes[4].id=likes-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://likes-service:8083
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/like/**, /api/comments/**
spring.cloud.gateway.server.webflux.routes[4].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[4].filters[0].args.key-resolver=#{@tokenKeyResolver}
spring.cloud.gateway.server.webflux.routes[4].filters[0].args.redis-rate-limiter.replenishRate=80
spring.cloud.gateway.server.webflux.routes[4].filters[0].args.redis-rate-limiter.burstCapacity=80

# 6. Interaction Service
spring.cloud.gateway.server.webflux.routes[5].id=interaction-service
spring.cloud.gateway.server.webflux.routes[5].uri=http://interaction-service:8085
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/relations/**, /api/friends/**, /api/search/**
spring.cloud.gateway.server.webflux.routes[5].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[5].filters[0].args.key-resolver=#{@tokenKeyResolver}
spring.cloud.gateway.server.webflux.routes[5].filters[0].args.redis-rate-limiter.replenishRate=80
spring.cloud.gateway.server.webflux.routes[5].filters[0].args.redis-rate-limiter.burstCapacity=80

# 7. Reel Service
spring.cloud.gateway.server.webflux.routes[6].id=reel-service
spring.cloud.gateway.server.webflux.routes[6].uri=http://reel-service:8084
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/reels/**
spring.cloud.gateway.server.webflux.routes[6].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[6].filters[0].args.key-resolver=#{@tokenKeyResolver}
spring.cloud.gateway.server.webflux.routes[6].filters[0].args.redis-rate-limiter.replenishRate=120
spring.cloud.gateway.server.webflux.routes[6].filters[0].args.redis-rate-limiter.burstCapacity=120

# 8. View Service
spring.cloud.gateway.server.webflux.routes[7].id=view-service
spring.cloud.gateway.server.webflux.routes[7].uri=http://view-service:8087
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/view/**
spring.cloud.gateway.server.webflux.routes[7].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[7].filters[0].args.key-resolver=#{@tokenKeyResolver}
spring.cloud.gateway.server.webflux.routes[7].filters[0].args.redis-rate-limiter.replenishRate=150
spring.cloud.gateway.server.webflux.routes[7].filters[0].args.redis-rate-limiter.burstCapacity=150

# 9. ReelFetch Service
spring.cloud.gateway.server.webflux.routes[8].id=reelfetch-service
spring.cloud.gateway.server.webflux.routes[8].uri=http://reelfetch-service:8089
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/api/reels-fetch/**
spring.cloud.gateway.server.webflux.routes[8].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[8].filters[0].args.key-resolver=#{@tokenKeyResolver}
spring.cloud.gateway.server.webflux.routes[8].filters[0].args.redis-rate-limiter.replenishRate=200
spring.cloud.gateway.server.webflux.routes[8].filters[0].args.redis-rate-limiter.burstCapacity=200

# 10. Chat REST API Service (Docker DNS targets the internal scale alias)
spring.cloud.gateway.server.webflux.routes[9].id=chat-api-service
spring.cloud.gateway.server.webflux.routes[9].uri=http://chat-service:8090
spring.cloud.gateway.server.webflux.routes[9].predicates=Path=/api/chat/**
spring.cloud.gateway.server.webflux.routes[9].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[9].filters[0].args.key-resolver=#{@tokenKeyResolver}
spring.cloud.gateway.server.webflux.routes[9].filters[0].args.redis-rate-limiter.replenishRate=60
spring.cloud.gateway.server.webflux.routes[9].filters[0].args.redis-rate-limiter.burstCapacity=60

# 11. Chat STOMP WebSocket Service (Docker DNS handles socket protocol handshakes)
spring.cloud.gateway.server.webflux.routes[10].id=chat-websocket-service
spring.cloud.gateway.server.webflux.routes[10].uri=http://chat-service:8090
spring.cloud.gateway.server.webflux.routes[10].predicates=Path=/ws/**

spring.cloud.gateway.server.webflux.routes[10].filters[0].name=DedupeResponseHeader
spring.cloud.gateway.server.webflux.routes[10].filters[0].args.name=Access-Control-Allow-Credentials Access-Control-Allow-Origin
spring.cloud.gateway.server.webflux.routes[10].filters[0].args.strategy=RETAIN_FIRST



######################################################################
# Actuator, Observability, and Logging Parameters
######################################################################
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=gateway
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=w3c
management.otlp.tracing.endpoint=http://otel-collector:4318/v1/traces
logging.level.org.springframework.cloud.gateway=TRACE

# OpenTelemetry Exporter Mapping Contexts
otel.exporter.otlp.endpoint=http://otel-collector:4318
otel.logs.exporter=none
otel.metrics.exporter=none
otel.traces.exporter=otlp
