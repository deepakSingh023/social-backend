############################
# Application
############################

spring.application.name=gateway
server.port=8080

############################
# JWT
############################

spring.jwt.secret=YOUR_SECRET

############################
# Gateway Routes
############################

spring.cloud.gateway.mvc.routes[0].id=auth-service
spring.cloud.gateway.mvc.routes[0].uri=http://auth-service:8080
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.mvc.routes[1].id=post-service
spring.cloud.gateway.mvc.routes[1].uri=http://post-service:8080
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/posts/**

spring.cloud.gateway.mvc.routes[2].id=profile-service
spring.cloud.gateway.mvc.routes[2].uri=http://profile-service:8080
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/profile/**

spring.cloud.gateway.mvc.routes[3].id=feed-service
spring.cloud.gateway.mvc.routes[3].uri=http://feed-service:8080
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/feed/**

spring.cloud.gateway.mvc.routes[4].id=comment-service
spring.cloud.gateway.mvc.routes[4].uri=http://comment-service:8080
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/api/comments/**

spring.cloud.gateway.mvc.routes[5].id=interaction-service
spring.cloud.gateway.mvc.routes[5].uri=http://interaction-service:8080
spring.cloud.gateway.mvc.routes[5].predicates[0]=Path=/api/interactions/**

############################
# Actuator
############################

management.endpoints.web.exposure.include=health,info,prometheus,metrics

management.endpoint.health.show-details=always

management.endpoint.prometheus.access=unrestricted

############################
# Micrometer
############################

management.prometheus.metrics.export.enabled=true

management.metrics.tags.application=gateway

############################
# Tracing
############################

management.tracing.enabled=true

management.tracing.sampling.probability=1.0

management.otlp.tracing.endpoint=http://otel-collector:4318/v1/traces

############################
# Logging
############################

logging.level.org.springframework.cloud.gateway=INFO

logging.pattern.level=%5p [traceId=%X{traceId:-},spanId=%X{spanId:-}]

