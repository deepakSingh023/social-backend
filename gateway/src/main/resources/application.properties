spring.application.name=gateway
server.port=8091

spring.jwt.secret=${JWT_SECRET}
app.gateway.secret=${GATEWAY_SECRET}

# Redis Data Connection
spring.data.redis.host=redis
spring.data.redis.port=6379

############################
# Actuator & Observability
############################
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=gateway
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=w3c
management.otlp.tracing.endpoint=http://otel-collector:4318/v1/traces
logging.level.org.springframework.cloud.gateway=INFO

# OpenTelemetry exporter
otel.exporter.otlp.endpoint=http://otel-collector:4318
otel.logs.exporter=none
otel.metrics.exporter=none
otel.traces.exporter=otlp

spring.cloud.gateway.mvc.bucket4j.proxy-manager-bean-name=lettuceProxyManager


