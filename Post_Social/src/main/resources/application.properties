spring.application.name=social-post

# Retry

resilience4j.retry.instances.importantApi.max-attempts=3
resilience4j.retry.instances.importantApi.wait-duration=2s
resilience4j.retry.instances.importantApi.enable-exponential-backoff=true
resilience4j.retry.instances.importantApi.exponential-backoff-multiplier=2
resilience4j.retry.instances.importantApi.retry-exceptions=\
java.net.ConnectException,\
java.net.SocketTimeoutException,\
feign.RetryableException

# Circuit Breaker

resilience4j.circuitbreaker.instances.importantApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.importantApi.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.importantApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.importantApi.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.importantApi.permitted-number-of-calls-in-half-open-state=3

# Cloudflare R2

cloudflare.r2.account-id=${R2_ACCOUNT_ID}
cloudflare.r2.bucket=posts
cloudflare.r2.access-key=${R2_ACCESS_KEY}
cloudflare.r2.secret-key=${R2_SECRET_KEY}
cloudflare.r2.posts-public-url=${R2_POSTS_PUBLIC_URL}

# MongoDB

spring.data.mongodb.uri=${MONGO_URI}

# Security

service.secret=${SERVICE_SECRET}
service.gateway.secret= ${GATEWAY_SECRET}

# Logging

logging.level.org.springframework.web=INFO
logging.level.root=INFO
logging.level.com.example=INFO

# Internal Services

ping.uri=http://post-service:8082/api/health
post.uri=http://feed-service:8086
profile.uri=http://profile-service:8081
like.url=http://likes-service:8083
feed.url=http://feed-service:8086
interaction.service= http://interaction-service:8085

# Server

server.port=8082

# CORS

app.cors.allowed-origins=*

# Multipart Uploads

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# Actuator / Metrics

management.defaults.metrics.export.enabled=true
management.metrics.use-global-registry=true
management.endpoint.metrics.enabled=true
management.endpoint.web.base-path=/actuator

management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://otel-collector:4318/v1/traces

# Enforce W3C Trace Context headers (Gateway and services must match)
management.tracing.propagation.type=w3c

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true

management.metrics.tags.application=post-service

logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

spring.kafka.listener.observation-enabled=true

spring.kafka.bootstrap-servers=kafka:9092

spring.kafka.consumer.group-id=post-service
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.social_post.dto.DenormalizeEvent
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.social_post.dto

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=5000

spring.kafka.template.observation-enabled=true
